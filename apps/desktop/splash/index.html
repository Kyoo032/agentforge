<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agentforge</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0d2137;
        color: #e8eef5;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .logo {
        width: auto;
        max-width: 9rem;
        max-height: 5.5rem;
        object-fit: contain;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      p {
        color: #8aa0b8;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="./logo.png" alt="" width="144" height="144" />
      <h1>Agentforge</h1>
      <p>Starting the local app. Paste your Toko Token gateway key in Settings, then Chat is ready.</p>
    </main>
  </body>
</html>
