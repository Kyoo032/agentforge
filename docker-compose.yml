# Legacy local Postgres. Product default is SQLite (data/agentforge.sqlite).
# Only useful if you check out a pre-SQLite commit and set DATABASE_URL.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    volumes:
      - agentforge_pg:/var/lib/postgresql/data

volumes:
  agentforge_pg:
