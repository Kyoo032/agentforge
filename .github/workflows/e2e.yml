# Parked 2026-08-28: GHA job startup was failing. Cursor Cloud Agents own
# the real stub Playwright suite (see AGENTS.md). Do not restore the full
# Playwright job until Cloud start (native Postgres, no Docker) is reliable.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agentforge:agentforge@127.0.0.1:5432/agentforge
      AGENTFORGE_RUNTIME: stub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Push schema
        run: pnpm --filter "@agentforge/db" exec drizzle-kit push --force
      - name: Install Chromium
        run: pnpm --filter "@agentforge/web" exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
